<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SEC 10-K RAG Assistant</title>
<style>
  :root {
    --bg: #f7f7f8;
    --panel: #ffffff;
    --border: #e2e2e6;
    --text: #1c1c1f;
    --muted: #6b6b74;
    --accent: #2f5fd6;
    --warn-bg: #fff4e5;
    --warn-border: #f0b957;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 14px; margin: 0 0 28px; }
  .tickers { font-weight: 600; color: var(--text); }

  form { display: flex; flex-direction: column; gap: 10px; }
  textarea {
    width: 100%;
    min-height: 70px;
    padding: 12px 14px;
    font-size: 15px;
    border: 1px solid var(--border);
    border-radius: 10px;
    resize: vertical;
    font-family: inherit;
  }
  textarea:focus { outline: none; border-color: var(--accent); }

  .row { display: flex; align-items: center; gap: 12px; }
  .row label { font-size: 13px; color: var(--muted); }
  .row input[type="number"] {
    width: 56px;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
  }
  button {
    margin-left: auto;
    background: var(--accent);
    color: white;
    border: none;
    padding: 9px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }

  #result { margin-top: 28px; display: none; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }
  .panel.refused { background: var(--warn-bg); border-color: var(--warn-border); }
  .answer { white-space: pre-wrap; line-height: 1.5; font-size: 15px; }

  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 18px;
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; }
  .score { font-variant-numeric: tabular-nums; color: var(--muted); }

  .example-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .example-btns button {
    margin: 0;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    font-weight: 400;
    font-size: 12px;
    padding: 6px 12px;
  }

  #loading { display: none; color: var(--muted); font-size: 14px; margin-top: 16px; }
  #error { display: none; color: #b3261e; font-size: 14px; margin-top: 16px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>SEC 10-K RAG Assistant</h1>
    <p class="subtitle">
      Ask a question about the 10-K filings for
      <span class="tickers">AAPL, MSFT, JPM, XOM, PFE, TSLA</span>.
      Retrieval-augmented, running fully locally (Qdrant + Ollama).
    </p>

    <form id="query-form">
      <textarea id="question" placeholder="e.g. What does JPMorgan say about interest rate risk?" required></textarea>
      <div class="row">
        <label for="top_k">top_k</label>
        <input type="number" id="top_k" value="5" min="1" max="20" />
        <button type="submit" id="submit-btn">Ask</button>
      </div>
    </form>

    <div class="example-btns">
      <button type="button" data-q="What are Apple's main risk factors related to supply chain?">Apple supply chain risk</button>
      <button type="button" data-q="What does JPMorgan say about interest rate risk?">JPMorgan interest rates</button>
      <button type="button" data-q="What are Netflix's main risk factors?">Netflix (not in corpus)</button>
      <button type="button" data-q="How do I bake a chocolate cake?">Off-topic question</button>
    </div>

    <div id="loading">Retrieving and generating…</div>
    <div id="error"></div>

    <div id="result">
      <div class="panel" id="answer-panel">
        <div class="answer" id="answer-text"></div>
        <div class="meta" id="meta"></div>
      </div>
      <table id="chunks-table">
        <thead>
          <tr><th>Ticker</th><th>Section</th><th>Score</th></tr>
        </thead>
        <tbody id="chunks-body"></tbody>
      </table>
    </div>
  </div>

  <script>
    const form = document.getElementById("query-form");
    const questionEl = document.getElementById("question");
    const topKEl = document.getElementById("top_k");
    const submitBtn = document.getElementById("submit-btn");
    const loadingEl = document.getElementById("loading");
    const errorEl = document.getElementById("error");
    const resultEl = document.getElementById("result");
    const answerPanel = document.getElementById("answer-panel");
    const answerText = document.getElementById("answer-text");
    const metaEl = document.getElementById("meta");
    const chunksTable = document.getElementById("chunks-table");
    const chunksBody = document.getElementById("chunks-body");

    document.querySelectorAll(".example-btns button").forEach((btn) => {
      btn.addEventListener("click", () => {
        questionEl.value = btn.dataset.q;
        form.requestSubmit();
      });
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = questionEl.value.trim();
      if (!question) return;

      submitBtn.disabled = true;
      loadingEl.style.display = "block";
      errorEl.style.display = "none";
      resultEl.style.display = "none";

      try {
        const resp = await fetch("/query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, top_k: Number(topKEl.value) || 5 }),
        });
        if (!resp.ok) {
          const body = await resp.text();
          throw new Error(`${resp.status}: ${body}`);
        }
        const data = await resp.json();
        renderResult(data);
      } catch (err) {
        errorEl.textContent = "Request failed: " + err.message;
        errorEl.style.display = "block";
      } finally {
        submitBtn.disabled = false;
        loadingEl.style.display = "none";
      }
    });

    function renderResult(data) {
      answerText.textContent = data.answer;
      answerPanel.classList.toggle("refused", data.refused);

      const metaParts = [
        `top score: ${data.top_score.toFixed(3)}`,
        `retrieval: ${data.retrieval_time_s.toFixed(2)}s`,
        `generation: ${data.generation_time_s.toFixed(2)}s`,
        `total: ${data.total_time_s.toFixed(2)}s`,
      ];
      if (data.prompt_tokens != null) metaParts.push(`prompt tokens: ${data.prompt_tokens}`);
      if (data.completion_tokens != null) metaParts.push(`completion tokens: ${data.completion_tokens}`);
      metaEl.textContent = metaParts.join("  ·  ");

      chunksBody.innerHTML = "";
      if (data.retrieved_chunks && data.retrieved_chunks.length) {
        chunksTable.style.display = "table";
        for (const c of data.retrieved_chunks) {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td>${c.ticker}</td><td>${c.section}</td><td class="score">${c.score.toFixed(3)}</td>`;
          chunksBody.appendChild(tr);
        }
      } else {
        chunksTable.style.display = "none";
      }

      resultEl.style.display = "block";
    }
  </script>
</body>
</html>
