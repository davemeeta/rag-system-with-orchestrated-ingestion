services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-pipeline-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  dagster:
    build: .
    container_name: rag-pipeline-dagster
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - dagster_home:/app/.dagster_home
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: sec_filings
      # Ollama runs on the host, not in this compose stack (per the project's
      # "no hosted/metered API" requirement — generation/embedding stay local
      # to the host machine's Ollama install, not containerized).
      OLLAMA_HOST: http://host.docker.internal:11434
      EMBED_MODEL: nomic-embed-text
      GEN_MODEL: llama3.2:3b
      SEC_EDGAR_USER_AGENT: ${SEC_EDGAR_USER_AGENT}
      DAGSTER_HOME: /app/.dagster_home
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_healthy
    command: ["dagster", "dev", "-h", "0.0.0.0", "-p", "3000", "-m", "orchestration.definitions"]

  api:
    build: .
    container_name: rag-pipeline-api
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: sec_filings
      OLLAMA_HOST: http://host.docker.internal:11434
      EMBED_MODEL: nomic-embed-text
      GEN_MODEL: llama3.2:3b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_healthy
    command: ["uvicorn", "ragpipeline.serving.main:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  qdrant_storage:
  dagster_home:
